name: Build desktop app

# Builds the app for Windows, macOS and Linux. On a published release the three files are
# attached to it; a manual run keeps them as workflow artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      languages:
        description: "Models to ship, as folder names separated by spaces"
        default: "zu xh nd sw"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SpellChecker-windows.exe
          - os: macos-latest
            asset: SpellChecker-macos.zip
          - os: ubuntu-22.04
            asset: SpellChecker-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      SPELLCHECKER_LANGUAGES: ${{ github.event.inputs.languages || 'zu xh nd sw' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nicegui==3.11.1 pywebview==6.2.1 scikit-learn==1.8.0 rapidfuzz==3.14.5 numpy==2.4.4 langdetect==1.0.9 pyinstaller==6.22.2

      - name: Build
        run: pyinstaller --noconfirm build.spec

      - name: Name the file
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/SpellChecker.exe "${{ matrix.asset }}"
          elif [ "$RUNNER_OS" = "macOS" ]; then (cd dist && zip -qry "../${{ matrix.asset }}" SpellChecker.app)
          else mv dist/SpellChecker "${{ matrix.asset }}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
